name: FB Post Monitor

on:
  schedule:
    # Chạy mỗi 15 phút (cú pháp cron theo giờ UTC). GitHub có thể trễ vài
    # phút khi tải cao, đây là giới hạn chung của GitHub Actions, không
    # phải lỗi của script.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # cho phép bấm "Run workflow" để chạy thử thủ công

permissions:
  contents: write   # cần quyền này để commit lại 2 file JSON trạng thái

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor script
        env:
          USER_ACCESS_TOKEN: ${{ secrets.USER_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fb_post_monitor.py

      - name: Commit updated state files (nếu có thay đổi)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_posts.json view_history.json error_alert_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update state files [skip ci]"
          git push || true
