name: FB Post Monitor

on:
  schedule:
    # Chạy 4 lần mỗi giờ, 24/7
    # Cố tình lệch khỏi phút 00/15/30/45 để giảm khả năng bị trễ
    - cron: "7,22,37,52 * * * *"

  # Vẫn giữ nút này để khi cần bạn có thể test thủ công
  workflow_dispatch:

permissions:
  contents: write

# Không cho 2 lượt monitor chạy chồng lên nhau
concurrency:
  group: fb-post-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    # Nếu có lỗi bất thường thì không để job treo quá lâu
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitor script
        env:
          USER_ACCESS_TOKEN: ${{ secrets.USER_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "======================================"
          echo "Bắt đầu FB Post Monitor"
          echo "UTC time: $(date -u)"
          echo "======================================"

          python fb_post_monitor.py

          echo ""
          echo "===== STATE FILES ====="
          ls -lh *.json 2>/dev/null || true

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in notified_posts.json view_history.json error_alert_state.json; do
            if [ -f "$file" ]; then
              echo "Tìm thấy $file"
              git add -f "$file"
            else
              echo "Chưa có $file"
            fi
          done

          echo "===== GIT STATUS ====="
          git status --short

          if git diff --cached --quiet; then
            echo "Không có thay đổi trạng thái để commit."
          else
            git commit -m "Update monitor state [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
