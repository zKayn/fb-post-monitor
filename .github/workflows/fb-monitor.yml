name: FB Post Monitor

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor script
        env:
          USER_ACCESS_TOKEN: ${{ secrets.USER_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python fb_post_monitor.py

          echo ""
          echo "===== SAU KHI CHẠY PYTHON ====="
          pwd
          ls -lah

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in notified_posts.json view_history.json error_alert_state.json; do
            if [ -f "$file" ]; then
              echo "Tìm thấy $file"
              git add -f "$file"
            else
              echo "Chưa có $file"
            fi
          done

          echo "===== GIT STATUS ====="
          git status

          if git diff --cached --quiet; then
            echo "Không có file trạng thái nào thay đổi."
          else
            git commit -m "Update monitor state [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
